<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码记录本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>我的密码本</h1>
            <div class="header-actions">
                <button id="import-btn" class="action-btn">导入</button>
                <button id="export-btn" class="action-btn">导出为 JSON</button>
            </div>
            <input type="file" id="import-file-input" accept=".json" style="display: none;">
        </header>

        <main>
            <section class="card add-entry-card">
                <h2>添加新条目</h2>
                <form id="add-entry-form">
                    <div class="form-group">
                        <label for="entry-name">网站 / 平台</label>
                        <input type="text" id="entry-name" required placeholder="例如：谷歌、Github">
                    </div>
                    <div class="form-group">
                        <label for="entry-url">网址 (选填)</label>
                        <input type="text" id="entry-url" placeholder="https://www.google.com">
                    </div>
                    <div class="form-group">
                        <label for="entry-username">账号</label>
                        <input type="text" id="entry-username" required placeholder="您的用户名或邮箱">
                    </div>
                    <div class="form-group">
                        <label for="entry-password">密码</label>
                        <input type="password" id="entry-password" required placeholder="您的密码">
                    </div>
                    <input type="hidden" id="entry-id">
                    <button type="submit" id="save-btn" class="save-btn">保存</button>
                    <button type="button" id="cancel-edit-btn" class="cancel-btn hidden">取消编辑</button>
                </form>
            </section>

            <section class="card vault-card">
                <div class="vault-header">
                    <h2>已存条目</h2>
                    <input type="search" id="search-input" placeholder="搜索...">
                </div>
                <ul id="entries-list">
                    <!-- Saved entries will be rendered here -->
                </ul>
                <p id="empty-list-msg" class="empty-state">还没有任何条目，快来添加一个吧！</p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <footer class="license-footer">
        <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>
    </footer>
</body>
</html>
